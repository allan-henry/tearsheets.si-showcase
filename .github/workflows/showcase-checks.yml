name: TEARSHEETS synthetic showcase checks

on:
  push:
    branches:
      - showcase/synthetic-attribution-controls-2026-10-12
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  synthetic_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test attribution and editorial controls
        run: npm test
      - name: Demonstrate a fictional archive run
        run: npm run demo

  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean showcase history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
